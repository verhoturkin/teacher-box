spring:
  application:
    name: teacher-box
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:${teacherbox.data-dir}/db/teacherbox;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  flyway:
    # Every module runs its own migrations in its own schema, see ModuleMigrations.
    enabled: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  web:
    resources:
      # No static files: the SPA is served by the nginx of the frontend container (ADR-0031).
      add-mappings: false

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

logging:
  file:
    # JSON log for the administrator's log search (ADR-0010); the console stays human-readable.
    name: ${teacherbox.data-dir}/logs/teacher-box.log
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      max-file-size: 10MB
      total-size-cap: 100MB
      max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Teacher Box

teacherbox:
  # Root for all persistent data. Overridden by TEACHERBOX_DATA_DIR (/data in Docker).
  data-dir: ./data
  portal:
    # Address of the portal for every link it gives out, e.g. https://school.example.com (ADR-0014);
    # takes precedence over the address entered in the interface.
    address: ${TEACHERBOX_PUBLIC_URL:}
