spring:
  application:
    name: teacher-box
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:${teacherbox.data-dir}/db/teacherbox;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  flyway:
    # Every module runs its own migrations in its own schema, see ModuleMigrations.
    enabled: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  web:
    resources:
      # Static files are served by platform/web (SpaWebConfigurer) only when the frontend is bundled.
      add-mappings: false

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Teacher Box

teacherbox:
  # Root for all persistent data. Overridden by TEACHERBOX_DATA_DIR (/data in Docker).
  data-dir: ./data
  notifications:
    # Address of the portal for links in messenger messages, e.g. https://school.example.com
    public-url: ${TEACHERBOX_PUBLIC_URL:}
