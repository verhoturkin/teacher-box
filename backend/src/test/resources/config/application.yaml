# Test overrides. Loaded on top of classpath:application.yaml because config/ has higher precedence.
spring:
  datasource:
    # Unique in-memory database per Spring context.
    url: jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1

teacherbox:
  data-dir: ${java.io.tmpdir}/teacherbox-test/${random.uuid}
  # Background jobs are invoked explicitly in tests.
  scheduling:
    enabled: false
  security:
    # Many sign-ins from one address in module tests; the limiter has its own tests.
    auth-rate-limit:
      requests: 0
