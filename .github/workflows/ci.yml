name: CI

# A release is a push to main whose version has no tag yet (ADR-0063): the same run publishes the images,
# then tags the commit, creates the GitHub release and publishes the wiki. Nobody pushes a release tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request cancels its older run; main never cancels a run that is under way (it may be a release).
# A newer push replaces only a run still waiting, and its run releases the same untagged version.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One version in backend, frontend and the lockfile; a new version needs its CHANGELOG section. On a
  # pull request this checks a release before the merge; on main a new version starts the release.
  version:
    name: Release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: ./scripts/release-version.sh

  docs:
    name: Docs (wiki links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Links to the wiki pages
        run: ./scripts/verify.sh docs

  backend:
    name: Backend (verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build, tests, coverage gates, modularity
        working-directory: backend
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (npm 11, ADR-0007)
        working-directory: frontend
        run: npx -y npm@11 ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests with coverage gates
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Validate the compose files
        run: |
          docker compose config -q
          docker compose --profile https --profile calls config -q
          docker compose -f compose.yaml -f compose.build.yaml config -q
      - name: Installer (shellcheck, dry run)
        run: ./scripts/verify.sh installer
      - name: Build the images (layer cache in GitHub Actions)
        uses: docker/bake-action@v7
        with:
          files: |
            compose.yaml
            compose.build.yaml
          load: true
          set: |
            backend.cache-from=type=gha,scope=ci-backend
            backend.cache-to=type=gha,mode=max,scope=ci-backend,ignore-error=true
            frontend.cache-from=type=gha,scope=ci-frontend
            frontend.cache-to=type=gha,mode=max,scope=ci-frontend,ignore-error=true
      # The JVM silently ignores an AOT cache it cannot use, so the first run makes that fatal (-XX:AOTMode=on,
      # only here) under the limits of compose.yaml; then the start time without and with the cache.
      - name: Check the AOT cache of the backend
        run: |
          image=ghcr.io/verhoturkin/teacher-box-backend:latest
          options='-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError'
          docker run --rm --network=none --memory=1g --cpus=2 \
            -e JAVA_TOOL_OPTIONS="$options -XX:AOTMode=on -Dspring.context.exit=onRefresh" "$image"
          for mode in off auto; do
            id="$(docker run -d --memory=1g --cpus=2 -e JAVA_TOOL_OPTIONS="$options -XX:AOTMode=$mode" "$image")"
            if ! timeout 120 sh -c "until docker logs $id 2>&1 | grep -q 'Started TeacherBoxApplication'; do sleep 1; done"; then
              docker logs "$id"
              exit 1
            fi
            echo "AOTMode=$mode: $(docker logs "$id" 2>&1 | grep -o 'Started TeacherBoxApplication in.*')"
            docker rm -fv "$id" >/dev/null
          done
      - name: Check the nginx configuration
        run: >-
          docker run --rm -e BACKEND_URL=http://127.0.0.1:8080
          ghcr.io/verhoturkin/teacher-box-frontend:latest nginx -t

  # Three slices of the browser suites plus the operations project (reset, restore, restart), each on
  # its own fresh instance with one worker: the tests share one instance's data and settings, so the
  # instances are what keeps them independent. Starts at once, without waiting for backend/frontend.
  # Playwright runs a dependency project in every shard, so "--shard" goes with --project=chromium and
  # operations is a job of its own (see e2e/README.md). The browser is the Google Chrome of the
  # runner image (E2E_BROWSER_CHANNEL=chrome): no browser download, no apt step.
  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'chromium 1/3', id: shard-1, args: '--project=chromium --shard=1/3' }
          - { name: 'chromium 2/3', id: shard-2, args: '--project=chromium --shard=2/3' }
          - { name: 'chromium 3/3', id: shard-3, args: '--project=chromium --shard=3/3' }
          - { name: 'operations', id: operations, args: '--project=operations --no-deps' }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build the images (layer cache in GitHub Actions)
        uses: docker/bake-action@v7
        with:
          files: |
            compose.yaml
            compose.build.yaml
          load: true
          set: |
            backend.cache-from=type=gha,scope=ci-backend
            backend.cache-to=type=gha,mode=max,scope=ci-backend,ignore-error=true
            frontend.cache-from=type=gha,scope=ci-frontend
            frontend.cache-to=type=gha,mode=max,scope=ci-frontend,ignore-error=true
      - name: Install the E2E dependencies
        working-directory: e2e
        run: npx -y npm@11 ci
      - name: Run the scenarios against a fresh instance
        env:
          E2E_NO_BUILD: '1'
          E2E_BROWSER_CHANNEL: chrome
        run: ./scripts/e2e.sh ${{ matrix.args }}
      - name: Keep the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.id }}
          path: e2e/blob-report
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: Keep the traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.id }}
          path: e2e/test-results
          retention-days: 7

  e2e-report:
    name: E2E report
    runs-on: ubuntu-latest
    needs: e2e
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: npx -y npm@11 ci
      - uses: actions/download-artifact@v5
        with:
          path: e2e/all-blobs
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge the shard reports
        working-directory: e2e
        run: npx playwright merge-reports --reporter html ./all-blobs
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Ready images for servers (ADR-0032, ADR-0062, ADR-0063): only for a release, after every check has passed.
  # Each platform is built on a native runner (no QEMU: the AOT training run of the backend is a JVM
  # start of the image's own architecture) and pushed by digest; publish then joins the digests into
  # one multi-platform index with the release tags.
  image:
    name: Build ${{ matrix.target }} image (${{ matrix.arch }})
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    needs: [version, backend, frontend, images, e2e]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [backend, frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/teacher-box-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same configuration as in publish: the version and the labels of the image.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.version.outputs.version, '-') }}
          flavor: latest=false
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.target }} image
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    needs: [version, image]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [backend, frontend]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/teacher-box-${{ matrix.target }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.target }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.version.outputs.version, '-') }}
          flavor: latest=false
          # "latest" follows the newest release; a pre-release (X.Y.Z-rc.1) does not move it.
      - name: Join the platforms under the release tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -- *
          test "$#" -eq 2
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " "$@")
      - name: Check the index
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}" --raw \
            | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture]
                     | (index("amd64") != null) and (index("arm64") != null)'

  # The tag and the GitHub release come last, once the images are out: a release that failed earlier has
  # no tag, so the next push to main (or "Re-run failed jobs") releases it again. Safe to re-run: an
  # existing tag on this commit and an existing release are kept. A tag pushed with GITHUB_TOKEN starts
  # no workflow.
  release:
    name: Tag and GitHub release
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    needs: [version, publish]
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: The release text from CHANGELOG.md
        run: ./scripts/release-version.sh --notes "$RUNNER_TEMP/notes.md"
      - name: Tag the commit
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git fetch --quiet --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            tagged="$(git rev-parse "$tag^{commit}")"
            test "$tagged" = "$GITHUB_SHA" || { echo "$tag is already on $tagged" >&2; exit 1; }
            echo "$tag is already on this commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$tag" -m "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
      - name: Create the GitHub release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "The release $tag already exists"
            exit 0
          fi
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"

  # The wiki shows the released version: docs/wiki is published once the release is out.
  wiki:
    name: Publish the wiki
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    needs: [version, docs, release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: docs/wiki → GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-wiki.sh "v${{ needs.version.outputs.version }}"
