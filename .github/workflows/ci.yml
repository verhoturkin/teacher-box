name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Docs (wiki links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Links to the wiki pages
        run: ./scripts/verify.sh docs

  backend:
    name: Backend (verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build, tests, coverage gates, modularity
        working-directory: backend
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (npm 11, ADR-0007)
        working-directory: frontend
        run: npx -y npm@11 ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests with coverage gates
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Validate the compose files
        run: |
          docker compose config -q
          docker compose --profile https --profile calls config -q
          docker compose -f compose.yaml -f compose.build.yaml config -q
      - name: Installer (shellcheck, dry run)
        run: ./scripts/verify.sh installer
      - name: Build the images (layer cache in GitHub Actions)
        uses: docker/bake-action@v7
        with:
          files: |
            compose.yaml
            compose.build.yaml
          load: true
          set: |
            backend.cache-from=type=gha,scope=ci-backend
            backend.cache-to=type=gha,mode=max,scope=ci-backend,ignore-error=true
            frontend.cache-from=type=gha,scope=ci-frontend
            frontend.cache-to=type=gha,mode=max,scope=ci-frontend,ignore-error=true
      - name: Check the nginx configuration
        run: >-
          docker run --rm -e BACKEND_URL=http://127.0.0.1:8080
          ghcr.io/verhoturkin/teacher-box-frontend:latest nginx -t

  # Three slices of the browser suites plus the operations project (reset, restore, restart), each on
  # its own fresh instance with one worker: the tests share one instance's data and settings, so the
  # instances are what keeps them independent. Starts at once, without waiting for backend/frontend.
  # Playwright runs a dependency project in every shard, so "--shard" goes with --project=chromium and
  # operations is a job of its own (see e2e/README.md).
  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'chromium 1/3', id: shard-1, args: '--project=chromium --shard=1/3' }
          - { name: 'chromium 2/3', id: shard-2, args: '--project=chromium --shard=2/3' }
          - { name: 'chromium 3/3', id: shard-3, args: '--project=chromium --shard=3/3' }
          - { name: 'operations', id: operations, args: '--project=operations --no-deps' }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build the images (layer cache in GitHub Actions)
        uses: docker/bake-action@v7
        with:
          files: |
            compose.yaml
            compose.build.yaml
          load: true
          set: |
            backend.cache-from=type=gha,scope=ci-backend
            backend.cache-to=type=gha,mode=max,scope=ci-backend,ignore-error=true
            frontend.cache-from=type=gha,scope=ci-frontend
            frontend.cache-to=type=gha,mode=max,scope=ci-frontend,ignore-error=true
      - name: Install Playwright
        working-directory: e2e
        run: |
          npx -y npm@11 ci
          npx playwright install --with-deps chromium
      - name: Run the scenarios against a fresh instance
        env:
          E2E_NO_BUILD: '1'
        run: ./scripts/e2e.sh ${{ matrix.args }}
      - name: Keep the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.id }}
          path: e2e/blob-report
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: Keep the traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.id }}
          path: e2e/test-results
          retention-days: 7

  e2e-report:
    name: E2E report
    runs-on: ubuntu-latest
    needs: e2e
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: npx -y npm@11 ci
      - uses: actions/download-artifact@v5
        with:
          path: e2e/all-blobs
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge the shard reports
        working-directory: e2e
        run: npx playwright merge-reports --reporter html ./all-blobs
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Ready images for servers (ADR-0032): only for a release tag, after every check has passed.
  publish:
    name: Publish ${{ matrix.target }} image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [backend, frontend, images, e2e]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/teacher-box-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # "latest" is the newest release tag (metadata-action's default for semver tags).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # The wiki shows the released version: docs/wiki is published once the release images are out.
  wiki:
    name: Publish the wiki
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [docs, publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: docs/wiki → GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-wiki.sh "${GITHUB_REF_NAME}"
