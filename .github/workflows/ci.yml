name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build, tests, coverage gates, modularity
        working-directory: backend
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (npm 11, ADR-0007)
        working-directory: frontend
        run: npx -y npm@11 ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests with coverage gates
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  images:
    name: Docker images (both variants)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose files
        run: |
          docker compose -f compose.split.yaml config -q
          docker compose -f compose.single.yaml config -q
      - name: Build the split variant
        run: docker compose -f compose.split.yaml build
      - name: Build the single-container variant
        run: docker compose -f compose.single.yaml build
      - name: Check the nginx configuration
        run: docker run --rm -e BACKEND_URL=http://127.0.0.1:8080 teacher-box-frontend:latest nginx -t

  e2e:
    name: E2E (Playwright, single container)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npx -y npm@11 ci
          npx playwright install --with-deps chromium
      - name: Run the scenario against a fresh instance
        run: ./scripts/e2e.sh
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
