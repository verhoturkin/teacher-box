name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build, tests, coverage gates, modularity
        working-directory: backend
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (npm 11, ADR-0007)
        working-directory: frontend
        run: npx -y npm@11 ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests with coverage gates
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Validate the compose files
        run: |
          docker compose config -q
          docker compose --profile calls config -q
          docker compose -f compose.yaml -f compose.build.yaml config -q
      - name: Build the images
        run: docker compose -f compose.yaml -f compose.build.yaml build
      - name: Check the nginx configuration
        run: >-
          docker run --rm -e BACKEND_URL=http://127.0.0.1:8080
          ghcr.io/verhoturkin/teacher-box-frontend:latest nginx -t

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npx -y npm@11 ci
          npx playwright install --with-deps chromium
      - name: Run the scenario against a fresh instance
        run: ./scripts/e2e.sh
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # Ready images for servers (ADR-0032): only for a release tag, after every check has passed.
  publish:
    name: Publish ${{ matrix.target }} image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [backend, frontend, images, e2e]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/teacher-box-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # "latest" is the newest release tag (metadata-action's default for semver tags).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
