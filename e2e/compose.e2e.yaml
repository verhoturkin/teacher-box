# Overrides of compose.yaml for the E2E run (scripts/e2e.sh): known teacher and administrator
# passwords, a separate port, no .env of the developer, an imitation of the Telegram Bot API, and the
# built-in calls (ADR-0030): LiveKit for this computer behind the nginx of the frontend (/livekit/).
services:
  backend:
    env_file: !reset []
    environment:
      TEACHERBOX_IDENTITY_TEACHER_PASSWORD: ${E2E_TEACHER_PASSWORD:-e2e-teacher-pass}
      TEACHERBOX_IDENTITY_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:-e2e-admin-pass}
      TEACHERBOX_NOTIFICATIONS_TELEGRAM_API_URL: http://telegram:8099
      TEACHERBOX_PUBLIC_URL: ${E2E_BASE_URL:-http://localhost:8091}
      TEACHERBOX_BACKUP_CRON: "-"
      # Every test signs in again; the default limit (30 a minute) is for real clients.
      TEACHERBOX_SECURITY_AUTH_RATE_LIMIT_REQUESTS: "1000"
      TEACHERBOX_MEETINGS_LIVEKIT_API_URL: http://livekit:7880
      TEACHERBOX_MEETINGS_LIVEKIT_API_KEY: e2e
      TEACHERBOX_MEETINGS_LIVEKIT_API_SECRET: e2e-livekit-secret-0123456789abcdef

  frontend:
    ports: !override
      - "${E2E_PORT:-8091}:8080"

  livekit:
    profiles: !reset []
    environment:
      LIVEKIT_KEYS: "e2e: e2e-livekit-secret-0123456789abcdef"
      LIVEKIT_RTC_USE_EXTERNAL_IP: "false"
      NODE_IP: 127.0.0.1
      # Media ports equal inside and outside the container (ICE advertises them), so that parallel
      # instances (E2E_SHARDS, scripts/e2e.sh) each take their own pair.
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          udp_port: ${E2E_LIVEKIT_UDP_PORT:-7882}
          tcp_port: ${E2E_LIVEKIT_TCP_PORT:-7881}
        turn:
          enabled: true
          udp_port: 3478
          relay_range_start: 30000
          relay_range_end: 30049
        room:
          auto_create: true
          empty_timeout: 300
          departure_timeout: 20
          max_participants: 20
    ports: !override
      - "${E2E_LIVEKIT_TCP_PORT:-7881}:${E2E_LIVEKIT_TCP_PORT:-7881}/tcp"
      - "${E2E_LIVEKIT_UDP_PORT:-7882}:${E2E_LIVEKIT_UDP_PORT:-7882}/udp"

  telegram:
    image: node:22-alpine
    command: ["node", "/mock/server.mjs"]
    volumes:
      - ./e2e/telegram-mock:/mock:ro
    ports:
      - "${E2E_TELEGRAM_PORT:-8099}:8099"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8099/health"]
      interval: 2s
      timeout: 2s
      retries: 15
