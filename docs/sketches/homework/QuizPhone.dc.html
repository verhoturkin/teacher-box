<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Телефон — вопрос</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ic{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:normal;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased}
.ph{width:390px;height:844px;overflow:hidden;position:relative;font-family:'Roboto Flex',system-ui,sans-serif;color:#1B1B21;background:#FBF8FF;display:flex;flex-direction:column}
.iconbtn{width:48px;height:48px;border-radius:24px;border:0;background:transparent;color:#45464F;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.fl{font-size:12px;font-weight:600;color:#45464F;display:block;margin-bottom:6px}
.field{background:#E3E1E9;border-radius:4px 4px 0 0;border-bottom:1px solid #767680;padding:12px 14px;font-size:15px;padding-left:16px;padding-right:16px}
.opt{display:flex;align-items:center;gap:8px;background:#F5F2FA;border-radius:12px;padding:4px 4px 4px 8px;min-height:48px;box-sizing:border-box}
.opt.right{background:#C8F0CF;color:#0B3A1A}
.opt .txt{flex:1;font-size:15px;color:#1B1B21}
.radio{width:20px;height:20px;border-radius:10px;border:2px solid #45464F;box-sizing:border-box;flex:0 0 20px}
.radio.on{border-color:#1F6B37;background:radial-gradient(#1F6B37 0 4px,transparent 5px)}
.sel{height:40px;border-radius:8px;border:1px solid #767680;display:inline-flex;align-items:center;gap:8px;padding:0 8px 0 12px;font:14px 'Roboto Flex',sans-serif;background:transparent;color:#1B1B21}
.step{display:inline-flex;align-items:center;border:1px solid #767680;border-radius:20px;height:40px}
.step button{width:40px;height:38px;border:0;background:transparent;color:#45464F;display:flex;align-items:center;justify-content:center}
.muted{color:#45464F}
.dock{position:absolute;left:0;right:0;bottom:0;background:#F5F2FA;padding:12px 16px 16px;display:flex;align-items:center;border-radius:28px 28px 0 0;gap:8px}
</style>
</helmet>
<div class="ph">
  <header style="height:64px;display:flex;align-items:center;padding:0 4px">
    <a class="iconbtn" href="PhoneEditor.dc.html" aria-label="К списку вопросов"><span class="ic">arrow_back</span></a>
    <h1 style="margin:0;font-size:20px;font-weight:400;flex:1">Вопрос 3 из 8</h1>
    <button class="iconbtn" aria-label="Создать копию"><span class="ic">content_copy</span></button>
    <button class="iconbtn" aria-label="Убрать вопрос" style="color:#BA1A1A"><span class="ic">delete</span></button>
  </header>
  <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding:4px 16px 96px">
    <div style="display:flex;gap:8px;align-items:center">
      <button class="sel"><span class="ic" style="font-size:20px;color:#4459A9">radio_button_checked</span>Один ответ<span class="ic">arrow_drop_down</span></button>
      <span style="flex:1"></span>
      <div class="step" aria-label="Баллы"><button aria-label="Меньше"><span class="ic" style="font-size:20px">remove</span></button><span style="width:44px;text-align:center;font-size:14px"><b>2</b> б.</span><button aria-label="Больше"><span class="ic" style="font-size:20px">add</span></button></div>
    </div>
    <div><label class="fl" for="mq">Текст вопроса</label><div class="field" id="mq" style="border-bottom:2px solid #4459A9">She has ___ three letters this morning.</div></div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <span class="fl" style="margin:0">Варианты · коснитесь кружка у верного</span>
      <div class="opt"><span class="radio" role="radio" aria-checked="false" aria-label="Верный: wrote"></span><span class="txt">wrote</span><button class="iconbtn" aria-label="Убрать вариант 1"><span class="ic" style="font-size:20px">close</span></button></div>
      <div class="opt right"><span class="radio on" role="radio" aria-checked="true" aria-label="Верный: written"></span><span class="txt">written</span><button class="iconbtn" aria-label="Убрать вариант 2"><span class="ic" style="font-size:20px">close</span></button></div>
      <div class="opt"><span class="radio" role="radio" aria-checked="false" aria-label="Верный: writed"></span><span class="txt">writed</span><button class="iconbtn" aria-label="Убрать вариант 3"><span class="ic" style="font-size:20px">close</span></button></div>
      <button style="align-self:flex-start;height:40px;border:0;background:transparent;color:#4459A9;font:500 14px 'Roboto Flex',sans-serif;display:flex;align-items:center;gap:6px;padding:0 4px"><span class="ic" style="font-size:20px">add</span>Добавить вариант</button>
    </div>
    <button style="height:48px;border-radius:12px;border:1px dashed #C6C5D0;background:transparent;font:500 14px 'Roboto Flex',sans-serif;color:#45464F;display:flex;align-items:center;gap:8px;padding:0 14px"><span class="ic" style="font-size:20px;color:#4459A9">lightbulb</span>Пояснение к ответу</button>
  </div>
  <div class="dock">
    <button style="height:40px;border:0;background:transparent;color:#4459A9;font:500 14px 'Roboto Flex',sans-serif;display:flex;align-items:center;gap:4px;padding:0 12px"><span class="ic">chevron_left</span>2</button>
    <span style="flex:1;text-align:center" class="muted"><span style="font-size:13px">сохранено</span></span>
    <button style="height:40px;border-radius:20px;border:0;background:#DEE1F9;color:#171B2C;font:500 14px 'Roboto Flex',sans-serif;display:flex;align-items:center;gap:4px;padding:0 16px 0 20px">Вопрос 4<span class="ic">chevron_right</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
