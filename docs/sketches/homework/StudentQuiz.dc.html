<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ученик — тест</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEDF4}
.ic{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:normal;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased}
.app{font-family:'Roboto Flex',system-ui,sans-serif;color:#1B1B21;background:#EFEDF4;min-height:960px;padding:24px;box-sizing:border-box;display:flex}
.pane{flex:1;min-width:0;background:#FBF8FF;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:24px}
.btn{height:40px;border-radius:20px;border:0;padding:0 16px;display:inline-flex;align-items:center;gap:8px;font:500 14px 'Roboto Flex',sans-serif;white-space:nowrap;justify-content:center}
.iconbtn{width:40px;height:40px;border-radius:20px;border:0;background:transparent;color:#45464F;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.opt{display:flex;align-items:center;gap:14px;font-size:18px;background:#F5F2FA;border-radius:16px;padding:16px 20px;border:2px solid transparent;cursor:pointer}
.opt.on{background:#DEE1F9;border-color:#4459A9}
.opt input{width:20px;height:20px;accent-color:#4459A9}
.map{width:40px;height:40px;border-radius:12px;border:0;font:600 14px 'Roboto Flex',sans-serif;display:inline-flex;align-items:center;justify-content:center}
.m-done{background:#DEE1F9;color:#171B2C}.m-cur{background:#4459A9;color:#fff}.m-todo{background:transparent;border:1px solid #C6C5D0;color:#45464F}
.muted{color:#45464F}
</style>
</helmet>
<div class="app">
  <main class="pane">
    <div style="display:flex;align-items:center;gap:12px">
      <a class="iconbtn" href="Student.dc.html" aria-label="Выйти из теста — ответы сохранятся"><span class="ic">close</span></a>
      <div style="flex:1"><div style="font-size:16px;font-weight:500">Тест · Present Perfect — упражнения 4–7</div><div class="muted" style="font-size:13px">Попытка 1 из 2 · ответы сохраняются сами</div></div>
      <span class="muted" style="font-size:14px">Вопрос 3 из 10</span>
    </div>
    <div style="height:4px;border-radius:2px;background:#E3E1E9;overflow:hidden" role="progressbar" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100" aria-label="Пройдено"><div style="width:30%;height:100%;background:#4459A9"></div></div>

    <div style="display:flex;gap:32px;flex-wrap:wrap;justify-content:center">
      <section style="flex:1 1 560px;max-width:720px;display:flex;flex-direction:column;gap:20px" aria-label="Вопрос 3">
        <div class="muted" style="font-size:14px">Один ответ · 1 балл</div>
        <h1 style="margin:0;font-size:28px;font-weight:500;line-height:1.3">She has ___ three letters this morning.</h1>
        <div style="display:flex;flex-direction:column;gap:10px" role="radiogroup" aria-label="Варианты">
          <label class="opt"><input type="radio" name="sq">wrote</label>
          <label class="opt on"><input type="radio" name="sq" checked>written</label>
          <label class="opt"><input type="radio" name="sq">writed</label>
          <label class="opt"><input type="radio" name="sq">write</label>
        </div>
        <div style="display:flex;gap:12px;margin-top:8px">
          <button class="btn" style="background:transparent;color:#4459A9;padding:0 16px"><span class="ic">arrow_back</span>Назад</button>
          <span style="flex:1"></span>
          <button class="btn" style="background:#4459A9;color:#fff">Дальше<span class="ic">arrow_forward</span></button>
        </div>
      </section>

      <aside style="flex:0 0 240px;display:flex;flex-direction:column;gap:12px" aria-label="Вопросы">
        <span class="muted" style="font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase">Вопросы</span>
        <div style="display:grid;grid-template-columns:repeat(5,40px);gap:8px">
          <button class="map m-done">1</button><button class="map m-done">2</button><button class="map m-cur" aria-current="step">3</button><button class="map m-todo">4</button><button class="map m-todo">5</button>
          <button class="map m-todo">6</button><button class="map m-todo">7</button><button class="map m-todo">8</button><button class="map m-todo">9</button><button class="map m-todo">10</button>
        </div>
        <button class="btn" style="background:#DEE1F9;color:#171B2C;margin-top:12px;justify-content:center">Завершить тест</button>
        <div class="muted" style="font-size:13px">Правильные ответы покажем после сдачи.</div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
