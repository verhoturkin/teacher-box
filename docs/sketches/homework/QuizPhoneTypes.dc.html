<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Телефон — тип вопроса</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ic{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:normal;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased}
.ph{width:390px;height:844px;overflow:hidden;position:relative;font-family:'Roboto Flex',system-ui,sans-serif;color:#1B1B21;background:#FBF8FF}
.scrim{position:absolute;inset:0;background:rgba(27,27,33,.32)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#F5F2FA;border-radius:28px 28px 0 0;padding:8px 0 24px;display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:16px;padding:12px 24px;border:0;background:transparent;text-align:left;font-family:inherit;color:#1B1B21}
.it .ic{color:#4459A9}
.muted{color:#45464F}
.q{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-radius:14px;background:#F5F2FA;font-size:14px;margin:0 16px 6px}
</style>
</helmet>
<div class="ph">
  <div style="padding:20px 16px 8px;font-size:20px" aria-hidden="true">Глаголы, часть 3</div>
  <div aria-hidden="true">
    <div class="q"><b>1</b>Вторая форма глагола bring</div>
    <div class="q"><b>2</b>Три формы глагола teach</div>
    <div class="q"><b>3</b>She has ___ three letters…</div>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <section class="sheet" role="dialog" aria-label="Тип вопроса">
    <div style="width:32px;height:4px;border-radius:2px;background:#767680;align-self:center;margin:6px 0 14px" aria-hidden="true"></div>
    <h2 style="margin:0 24px 8px;font-size:20px;font-weight:500">Новый вопрос</h2>
    <sc-for list="{{types}}" as="t" hint-placeholder-count="6">
      <button class="it"><span class="ic">{{t.icon}}</span><span style="flex:1"><span style="display:block;font-size:16px">{{t.name}}</span><span class="muted" style="font-size:13px">{{t.hint}}</span></span></button>
    </sc-for>
    <div style="border-top:1px solid #C6C5D0;margin:8px 0"></div>
    <button class="it"><span class="ic" style="color:#390035">auto_awesome</span><span style="flex:1;font-size:16px;color:#390035">Составить с ИИ</span></button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { types: [
      { icon: 'radio_button_checked', name: 'Один ответ', hint: 'Один верный вариант' },
      { icon: 'check_box', name: 'Несколько ответов', hint: 'Все верные варианты' },
      { icon: 'short_text', name: 'Короткий ответ', hint: 'Слово или фраза' },
      { icon: 'pin', name: 'Число', hint: 'С допуском ±' },
      { icon: 'compare_arrows', name: 'Соответствие', hint: 'Соединить пары' },
      { icon: 'format_list_numbered', name: 'Порядок', hint: 'Расставить по порядку' }
    ] };
  }
}
</script>
</body>
</html>
