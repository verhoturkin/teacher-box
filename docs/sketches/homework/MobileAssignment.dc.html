<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Телефон — открытое задание</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ic{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:normal;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased}
.ph{width:390px;height:844px;overflow:hidden;position:relative;font-family:'Roboto Flex',system-ui,sans-serif;color:#1B1B21;background:#FBF8FF;display:flex;flex-direction:column}
.top{height:64px;display:flex;align-items:center;gap:4px;padding:0 4px;flex:0 0 64px}
.iconbtn{width:48px;height:48px;border-radius:24px;border:0;background:transparent;color:#45464F;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.label{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#45464F}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap}
.t-warn{background:#FFE08D;color:#3D2E00}
.t-ok{background:#C8F0CF;color:#0B3A1A}
.t-err{background:#FFDAD6;color:#410002}
.av{width:40px;height:40px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:0 0 40px}
.st{background:#EFEDF4;border-radius:20px;padding:16px;display:flex;align-items:center;gap:12px}
.seg{display:flex;border:1px solid #767680;border-radius:20px;overflow:hidden;height:40px}
.seg button{flex:1;border:0;background:transparent;font:500 14px 'Roboto Flex',sans-serif;color:#1B1B21}
.seg button+button{border-left:1px solid #767680}
.seg button.on{background:#DEE1F9;color:#171B2C}
.muted{color:#45464F}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 20px;background:#F5F2FA;display:flex;gap:8px}
</style>
</helmet>
<div class="ph">
  <header class="top">
    <a class="iconbtn" href="MobileList.dc.html" aria-label="Назад"><span class="ic">arrow_back</span></a>
    <span style="flex:1"></span>
    <button class="iconbtn" aria-label="Изменить"><span class="ic">edit</span></button>
    <button class="iconbtn" aria-label="Ещё"><span class="ic">more_vert</span></button>
  </header>

  <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding:0 16px 96px">
    <div>
      <h1 style="margin:0;font-size:24px;font-weight:500;line-height:1.25">Present Perfect — упражнения 4–7</h1>
      <div class="muted" style="font-size:14px;margin-top:4px">Группа B1 · до чт, 30.10, 16:00</div>
    </div>

    <div class="seg" role="tablist" aria-label="Раздел">
      <button class="on" role="tab" aria-selected="true">Ученики 4</button>
      <button role="tab" aria-selected="false">Задание</button>
      <button role="tab" aria-selected="false">Ошибки</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{students}}" as="s" hint-placeholder-count="4">
        <div class="st">
          <span class="av" style="background:{{s.bg}};color:{{s.fg}}">{{s.ini}}</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:15px">{{s.name}}</div>
            <div class="muted" style="font-size:12px">{{s.when}}</div>
          </div>
          <span class="tag {{s.cls}}">{{s.status}}</span>
          <span class="ic muted">chevron_right</span>
        </div>
      </sc-for>
    </div>

    <button style="align-self:flex-start;height:40px;border:0;background:transparent;color:#4459A9;font:500 14px 'Roboto Flex',sans-serif;display:flex;align-items:center;gap:8px;padding:0 4px"><span class="ic" style="font-size:20px">person_add</span>Выдать ещё</button>
  </div>

  <div class="bottom">
    <a style="text-decoration:none;flex:1;height:40px;border-radius:20px;border:0;background:#4459A9;color:#fff;font:500 14px 'Roboto Flex',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px" href="ReviewPhone.dc.html"><span class="ic">rate_review</span>Проверить 2 работы</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      students: [
        { ini: 'АС', name: 'Анна Смирнова', bg: '#DCE1FF', fg: '#001550', when: 'сдано сегодня, 09:12 · тест 8/10', status: 'Проверить', cls: 't-warn' },
        { ini: 'ДО', name: 'Дмитрий Орлов', bg: '#FFE08D', fg: '#3D2E00', when: 'сдано вчера, 21:30 · тест 9/10', status: 'Проверить', cls: 't-warn' },
        { ini: 'ИП', name: 'Илья Петров', bg: '#FFD7F3', fg: '#390035', when: 'оценка 4', status: 'Принято', cls: 't-ok' },
        { ini: 'МК', name: 'Мария Ковалёва', bg: '#C8F0CF', fg: '#0B3A1A', when: 'вернули 28.10', status: 'Доработка', cls: 't-err' }
      ]
    };
  }
}
</script>
</body>
</html>
