<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Учитель, телефон — настройки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ic{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:normal;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased}
.ph{width:390px;height:844px;overflow:hidden;position:relative;font-family:'Roboto Flex',system-ui,sans-serif;color:#1B1B21;background:#FBF8FF;display:flex;flex-direction:column}
.top{height:64px;display:flex;align-items:center;gap:4px;padding:0 4px 0 16px;flex:0 0 64px}
.iconbtn{width:48px;height:48px;border-radius:24px;border:0;background:transparent;color:#45464F;display:inline-flex;align-items:center;justify-content:center}
.label{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#45464F}
.muted{color:#45464F}
.list{display:flex;flex-direction:column;gap:2px;border-radius:16px;overflow:hidden}
.list>:not(.tile){display:contents}
.tile{display:flex;align-items:center;gap:16px;min-height:56px;padding:12px 16px;background:#F5F2FA;box-sizing:border-box;border-radius:4px;font-size:14px;color:inherit;text-decoration:none}
.tile.cur{background:#DEE1F9}
.tile .t{flex:1;min-width:0}.tile .t b{display:block;font-weight:500;font-size:16px}.tile .t .muted{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:40px;height:40px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:0 0 40px;background:#DEE1F9;color:#171B2C}
.tile.cur .av{background:#FBF8FF}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap}
.t-err{background:#FFDAD6;color:#410002}
.nav{height:80px;flex:0 0 80px;background:#EFEDF4;display:flex;justify-content:space-around;align-items:center}
.ni{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:#45464F;text-decoration:none}
.pill{width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.ni.on{color:#1B1B21}.ni.on .pill{background:#DEE1F9;color:#171B2C}
</style>
</helmet>
<div class="ph">
  <header class="top">
    <h1 style="margin:0;font-size:22px;font-weight:400;flex:1">Настройки</h1>
    <button class="iconbtn" aria-label="Справка"><span class="ic">help</span></button>
  </header>

  <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:0 16px 16px">
    <div class="list">
      <a class="tile cur" href="Main.dc.html">
        <span class="av" style="background:#FFD7F3;color:#390035">ЕВ</span>
        <span class="t"><b>Елена Викторовна</b><span class="muted">Мой аккаунт · уведомления, вход, тема</span></span>
        <span class="ic">chevron_right</span>
      </a>
    </div>

    <span class="label" style="margin-top:6px">Портал</span>
    <nav class="list" aria-label="Разделы настроек">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <a class="tile" href="{{c.href}}">
          <span class="av"><span class="ic">{{c.icon}}</span></span>
          <span class="t"><b>{{c.title}}</b><span class="muted">{{c.sum}}</span></span>
          <sc-if value="{{c.badge}}" hint-placeholder-val="{{false}}"><span class="tag t-err">{{c.badge}}</span></sc-if>
          <span class="ic muted">chevron_right</span>
        </a>
      </sc-for>
    </nav>
  </div>

  <nav class="nav" aria-label="Разделы">
    <a class="ni" href="#"><span class="pill"><span class="ic">home</span></span>Главная</a>
    <a class="ni" href="#"><span class="pill"><span class="ic">calendar_month</span></span>Расписание</a>
    <a class="ni" href="#"><span class="pill"><span class="ic">assignment</span></span>Задания</a>
    <a class="ni" href="#"><span class="pill"><span class="ic">group</span></span>Ученики</a>
    <a class="ni on" href="#"><span class="pill"><span class="ic" style="font-variation-settings:'FILL' 1">menu</span></span>Ещё</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cats: [
        { href: 'Portal.dc.html', icon: 'palette', title: 'Оформление портала', sum: 'Название, логотип, цвет', badge: '' },
        { href: 'Lessons.dc.html', icon: 'event', title: 'Занятия', sum: 'Пояс, цена, правила, календарь', badge: '' },
        { href: 'Tags.dc.html', icon: 'sell', title: 'Ученики', sum: 'Теги: уровень, класс, формат', badge: '' },
        { href: 'PhoneMessengers.dc.html', icon: 'forum', title: 'Мессенджеры', sum: '2 не доставлено', badge: '2' },
        { href: 'Ai.dc.html', icon: 'auto_awesome', title: 'ИИ-помощник', sum: '2 подключения · 34 % лимита', badge: '' },
        { href: 'Data.dc.html', icon: 'database', title: 'Данные', sum: 'Копия сегодня в 03:00', badge: '' }
      ]
    };
  }
}
</script>
</body>
</html>
