<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Телефон — подключить мессенджер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ic{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:normal;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased}
.ph{width:390px;height:844px;overflow:hidden;position:relative;font-family:'Roboto Flex',system-ui,sans-serif;color:#1B1B21;background:#FBF8FF;display:flex;flex-direction:column}
.iconbtn{width:48px;height:48px;border-radius:24px;border:0;background:transparent;color:#45464F;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn{height:40px;border-radius:20px;border:0;padding:0 16px;display:inline-flex;align-items:center;gap:8px;font:500 14px 'Roboto Flex',sans-serif;white-space:nowrap;justify-content:center;text-decoration:none}
.btn .ic{font-size:20px}
.filled{background:#4459A9;color:#fff}
.muted{color:#45464F}
.av{width:40px;height:40px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 40px;background:#DEE1F9;color:#171B2C}
.list{display:flex;flex-direction:column;gap:2px;border-radius:16px;overflow:hidden}
.ghost{height:56px;background:#F5F2FA;border-radius:4px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#F5F2FA;border-radius:28px 28px 0 0;padding:8px 24px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sheet .h{width:32px;height:4px;border-radius:2px;background:#767680;align-self:center;margin:6px 0 2px}
</style>
</helmet>
<div class="ph">
  <div style="padding:20px 16px;display:flex;flex-direction:column;gap:12px" aria-hidden="true">
    <div style="font-size:22px">Мой аккаунт</div>
    <div class="list"><div class="ghost"></div></div>
    <div class="list"><div class="ghost"></div><div class="ghost"></div></div>
    <div class="list"><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(27,27,33,.32)"></div>

  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="ct">
    <span class="h"></span>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="av"><span class="ic">send</span></span>
      <h2 id="ct" style="margin:0;font-size:22px;font-weight:400;flex:1">Подключить Telegram</h2>
      <a class="iconbtn" href="StudentPhone.dc.html" aria-label="Закрыть"><span class="ic">close</span></a>
    </div>
    <p style="margin:0;font-size:16px;line-height:1.5">Откройте бота и нажмите «Запустить» — аккаунт подключится сам.</p>
    <a class="btn filled" href="#"><span class="ic">open_in_new</span>Открыть Telegram</a>

    <div style="display:flex;align-items:center;gap:12px;color:#45464F;font-size:12px"><span style="flex:1;height:1px;background:#C6C5D0"></span>или отправьте боту код<span style="flex:1;height:1px;background:#C6C5D0"></span></div>
    <div style="display:flex;align-items:center;gap:8px;background:#E3E1E9;border-radius:16px;padding:4px 4px 4px 16px;min-height:56px;box-sizing:border-box">
      <span style="flex:1;font-size:28px;font-weight:500;letter-spacing:6px">482 913</span>
      <button class="iconbtn" aria-label="Скопировать код"><span class="ic">content_copy</span></button>
    </div>

    <div style="display:flex;align-items:center;gap:12px">
      <span style="width:24px;height:24px;border-radius:12px;border:3px solid #DEE1F9;border-top-color:#4459A9;box-sizing:border-box;flex:0 0 24px" aria-hidden="true"></span>
      <span class="muted" style="font-size:14px">Ждём подключения… Код действует до 15:40.</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</body>
</html>
