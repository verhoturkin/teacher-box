<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мастер — телефон</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF8FF}
.ic{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:normal;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased}
.ph{width:390px;height:844px;box-sizing:border-box;font-family:'Roboto Flex',system-ui,sans-serif;color:#1B1B21;background:#FBF8FF;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:4px;height:64px;padding:0 4px}
.iconbtn{width:48px;height:48px;border-radius:24px;border:0;background:transparent;color:#45464F;display:inline-flex;align-items:center;justify-content:center}
.prog{height:4px;border-radius:2px;background:#E3E1E9;margin:0 16px;overflow:hidden}
.prog i{display:block;height:4px;width:50%;background:#4459A9;border-radius:2px}
.body{flex:1;padding:16px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
h1{margin:0;font-size:28px;font-weight:500;line-height:36px}
.lead{margin:0;font-size:14px;line-height:20px;color:#45464F}
.field{background:#E3E1E9;border-radius:4px 4px 0 0;border-bottom:1px solid #767680;padding:8px 16px;min-height:56px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;width:100%;position:relative}
.field label{font-size:12px;color:#45464F}
.field input{border:0;background:transparent;font:16px 'Roboto Flex',sans-serif;color:#1B1B21;padding:0;width:100%}
.field .ic.end{position:absolute;right:12px;top:16px;color:#45464F}
.hint{font-size:12px;color:#45464F;margin:4px 16px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ex{background:#EFEDF4;border-radius:16px;padding:12px 16px;display:flex;gap:12px;font-size:13px;line-height:1.45}
.ex .ic{color:#4459A9;font-size:20px}
.foot{display:flex;align-items:center;gap:8px;padding:12px 16px 24px;border-top:1px solid #E3E1E9}
.btn{height:48px;border-radius:24px;border:0;padding:0 24px;display:inline-flex;align-items:center;gap:8px;font:500 14px 'Roboto Flex',sans-serif;white-space:nowrap;justify-content:center}
.filled{background:#4459A9;color:#fff;flex:1}.textbtn{background:transparent;color:#4459A9;padding:0 16px}
</style>
</helmet>
<div class="ph">
  <header class="bar">
    <button class="iconbtn" aria-label="Назад"><span class="ic">arrow_back</span></button>
    <b style="flex:1;font-size:16px;font-weight:500">Шаг 2 из 4</b>
    <button class="btn textbtn">Пропустить</button>
  </header>
  <div class="prog" role="progressbar" aria-valuenow="2" aria-valuemin="1" aria-valuemax="4" aria-label="Шаг 2 из 4"><i></i></div>
  <main class="body">
    <h1>Время и оплата</h1>
    <p class="lead">По этому времени строится расписание и считаются отчёты.</p>
    <div><div class="field"><label for="tz">Часовой пояс</label><input id="tz" value="Москва (UTC+3)"><span class="ic end">arrow_drop_down</span></div><div class="hint">Как на этом телефоне.</div></div>
    <div><div class="field"><label for="dur">Длительность занятия</label><input id="dur" value="60 мин"><span class="ic end">arrow_drop_down</span></div></div>
    <div class="two">
      <div class="field"><label for="cur">Валюта</label><input id="cur" value="₽"><span class="ic end">arrow_drop_down</span></div>
      <div class="field"><label for="pr">Цена</label><input id="pr" value="1 500"></div>
    </div>
    <div class="ex"><span class="ic">event</span><span>Так будет в расписании: <b>чт, 18:00–19:00 · 1 500 ₽</b></span></div>
  </main>
  <footer class="foot"><button class="btn filled">Далее</button></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
