# Variant 2 (ADR-0004): API and SPA in a single container.
#
#   cp .env.example .env    # adjust settings
#   docker compose -f compose.single.yaml up -d --build
name: teacher-box

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: single
    image: teacher-box:${TEACHERBOX_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TEACHERBOX_DATA_DIR: /data
    ports:
      - "${TEACHERBOX_HTTP_PORT:-8080}:8080"
    volumes:
      - teacherbox-data:/data
    # Lets the embedded database close cleanly on shutdown.
    stop_grace_period: 30s

volumes:
  teacherbox-data:
