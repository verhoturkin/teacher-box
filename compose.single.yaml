# Variant 2 (ADR-0004): API and SPA in a single container.
#
#   cp .env.example .env    # adjust settings
#   docker compose -f compose.single.yaml up -d --build
name: teacher-box

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: single
    image: teacher-box:${TEACHERBOX_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TEACHERBOX_DATA_DIR: /data
    # A proxy on the host (e.g. a VPN client for Telegram) is reachable as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${TEACHERBOX_HTTP_PORT:-8080}:8080"
    volumes:
      - teacherbox-data:/data
    # Lets the embedded database close cleanly on shutdown.
    stop_grace_period: 30s
    # Memory for the JVM (it takes 75% of the limit, see JAVA_TOOL_OPTIONS in the Dockerfile).
    deploy:
      resources:
        limits:
          memory: ${TEACHERBOX_MEMORY_LIMIT:-1g}
          cpus: "${TEACHERBOX_CPU_LIMIT:-2}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # Built-in calls (ADR-0030), only with the profile:  COMPOSE_PROFILES=calls  (or --profile calls).
  # Media goes straight to it: open 7881/tcp, 7882/udp, 3478/udp and 30000-30049/udp (docs/operations.md).
  livekit:
    image: livekit/livekit-server:v1.13.7
    profiles: ["calls"]
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${TEACHERBOX_MEETINGS_LIVEKIT_API_KEY:-}: ${TEACHERBOX_MEETINGS_LIVEKIT_API_SECRET:-}"
      NODE_IP: ${TEACHERBOX_LIVEKIT_NODE_IP:-}
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Signalling for your own reverse proxy: route /livekit/ of the portal here (docs/operations.md).
      - "127.0.0.1:${TEACHERBOX_LIVEKIT_HTTP_PORT:-7880}:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"
      - "30000-30049:30000-30049/udp"
    deploy:
      resources:
        limits:
          memory: ${TEACHERBOX_LIVEKIT_MEMORY_LIMIT:-512m}
          cpus: "${TEACHERBOX_LIVEKIT_CPU_LIMIT:-2}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  teacherbox-data:
