# Variant 1 (ADR-0004): backend and frontend in separate containers.
#
#   cp .env.example .env    # adjust settings
#   docker compose -f compose.split.yaml up -d --build
#
# Only the frontend (nginx) is published; it proxies /api to the backend over the internal network.
name: teacher-box

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: backend
    image: teacher-box-backend:${TEACHERBOX_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TEACHERBOX_DATA_DIR: /data
    # A proxy on the host (e.g. a VPN client for Telegram) is reachable as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - teacherbox-data:/data
    # Lets the embedded database close cleanly on shutdown.
    stop_grace_period: 30s
    # Memory for the JVM (it takes 75% of the limit, see JAVA_TOOL_OPTIONS in the Dockerfile).
    deploy:
      resources:
        limits:
          memory: ${TEACHERBOX_MEMORY_LIMIT:-1g}
          cpus: "${TEACHERBOX_CPU_LIMIT:-2}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: frontend
    image: teacher-box-frontend:${TEACHERBOX_VERSION:-latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      LIVEKIT_URL: http://livekit:7880
    ports:
      - "${TEACHERBOX_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # Built-in calls (ADR-0030), only with the profile:  COMPOSE_PROFILES=calls  (or --profile calls).
  # Media goes straight to it: open 7881/tcp, 7882/udp, 3478/udp and 30000-30049/udp (docs/operations.md).
  livekit:
    image: livekit/livekit-server:v1.13.7
    profiles: ["calls"]
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${TEACHERBOX_MEETINGS_LIVEKIT_API_KEY:-}: ${TEACHERBOX_MEETINGS_LIVEKIT_API_SECRET:-}"
      # STUN finds the public address; false + TEACHERBOX_LIVEKIT_NODE_IP give it explicitly.
      LIVEKIT_RTC_USE_EXTERNAL_IP: ${TEACHERBOX_LIVEKIT_USE_EXTERNAL_IP:-true}
      NODE_IP: ${TEACHERBOX_LIVEKIT_NODE_IP:-}
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"
      - "30000-30049:30000-30049/udp"
    deploy:
      resources:
        limits:
          memory: ${TEACHERBOX_LIVEKIT_MEMORY_LIMIT:-512m}
          cpus: "${TEACHERBOX_LIVEKIT_CPU_LIMIT:-2}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  teacherbox-data:
