# LiveKit media server for the built-in calls (ADR-0030), profile "calls" of the compose files.
# The API key and secret come from LIVEKIT_KEYS (built from TEACHERBOX_MEETINGS_LIVEKIT_API_KEY/SECRET),
# the public address from NODE_IP (TEACHERBOX_LIVEKIT_NODE_IP) or, when it is empty, from STUN.
port: 7880
log_level: info
rtc:
  # Media: one UDP port for every call, TCP as the fallback for networks that block UDP.
  udp_port: 7882
  tcp_port: 7881
  use_external_ip: true
turn:
  # Embedded TURN over UDP for clients behind strict NAT.
  enabled: true
  udp_port: 3478
  # Relayed media; the same range is published by the compose files.
  relay_range_start: 30000
  relay_range_end: 30049
room:
  # Rooms are created on the first join and closed when empty (rooms "tb-<ownerId>").
  auto_create: true
  empty_timeout: 300
  departure_timeout: 20
  max_participants: 20
