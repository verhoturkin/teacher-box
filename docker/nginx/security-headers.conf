# Included in every location that sets its own headers (add_header is not inherited then).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Camera, microphone and screen sharing only for the portal itself (built-in calls, ADR-0030).
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
# Same policy as the backend sends (PlatformSecurityAutoConfiguration.CONTENT_SECURITY_POLICY).
# Excalidraw boards (ADR-0028) need nothing more: fonts are self-hosted (excalidraw-assets/), images are data:/blob:.
# SVG export's glyph subsetting would need 'unsafe-eval' (embind) - not granted, Excalidraw embeds whole fonts then.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
